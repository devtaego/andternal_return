<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANTERNAL RETURN</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b1a;--panel:#171a33;--panel2:#20244a;--edge:#000;--hi:#3a4080;--up:#ff4d5e;--down:#4d8dff;--gold:#ffd23f;--txt:#f2f0ff;--mut:#9a9cc4;--purple:#b26bff;--green:#3ddc97}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at top,#1a1440 0%,var(--bg) 60%) fixed}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000018 2px 3px)}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
img.spr,canvas.px8{image-rendering:pixelated;image-rendering:crisp-edges}
.wrap{max-width:480px;margin:0 auto;padding:10px 10px 112px;position:relative}
.screen{display:none}.screen.on{display:block}
.pf{font-family:'Press Start 2P',monospace;letter-spacing:0}
.bh{font-family:'Black Han Sans',sans-serif}
/* pixel panel */
.px{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--hi),inset 0 -5px 0 2px #0006,0 4px 0 #000;position:relative;
 clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.panel{padding:12px 13px;margin-bottom:10px}
.pbtn{border:3px solid #000;font-weight:900;position:relative;transition:transform .05s;box-shadow:inset -3px -4px 0 #0005,inset 3px 3px 0 #fff4,0 3px 0 #000}
.pbtn:active:not(:disabled){transform:translateY(3px);box-shadow:inset -3px -4px 0 #0005,inset 3px 3px 0 #fff4,0 0 0 #000}
.pbtn:disabled{filter:grayscale(.85) brightness(.55);cursor:default}
.gold{background:var(--gold);color:#3a2300}
.red{background:#e8384d;color:#fff}
.blue{background:#3b6fe0;color:#fff}
.purp{background:#8a4fe0;color:#fff}
.dark{background:var(--panel2);color:var(--txt)}
/* intro */
#intro .wrap{padding-top:18px;text-align:center}
.titlebox{position:relative;margin-bottom:14px}
#introScene{width:100%;display:block}
.logo{font-family:'Black Han Sans';font-size:54px;line-height:1;color:var(--gold);text-shadow:4px 4px 0 #b3410e,8px 8px 0 #000;margin:12px 0 6px;animation:float 2.4s ease-in-out infinite}
.logo-en{font-size:13px;color:#ff9b5e;font-weight:900;letter-spacing:1px}
.logo-top{font-size:32px;line-height:1.3;color:var(--gold);text-shadow:4px 4px 0 #b3410e,7px 7px 0 #000;margin:22px 0 4px;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.sub{color:var(--mut);margin:14px 0 16px;line-height:1.7;font-size:14px}
.rules{text-align:left;font-size:13px;line-height:2}
.rules img{vertical-align:-5px;margin-right:6px}
.rules b{color:var(--gold)}
.press{width:100%;padding:18px;font-size:16px;margin-top:14px}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:2px solid #000;padding:5px 9px;font-size:12px;margin:3px;color:var(--mut)}
.chip b{color:var(--txt)}
/* hud */
.hud{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stb{padding:7px 9px;font-size:10px;color:var(--gold);background:#2a1d55}
.weeks{flex:1;display:grid;grid-template-columns:repeat(30,1fr);gap:1px}
.weeks i{height:12px;background:#262a52;border:1px solid #000}
.weeks i.d{background:var(--gold)}
.weeks i.c{background:#fff;animation:blink .6s steps(2) infinite}
.weeks i.ch{box-shadow:inset 0 0 0 2px #ff8a1f}
.ticker{overflow:hidden;white-space:nowrap;font-size:12px;color:#ffd23f;padding:6px 0;border-top:2px solid #13203a;font-weight:700}
.ticker span{display:inline-block;padding-left:100%;animation:tick 16s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.shop{background:#1d1440}
.sline{background:#0b0d24;border:2px solid #000;padding:8px 10px;margin:7px 0;font-size:13px;font-weight:700;line-height:1.5;display:flex;gap:8px;align-items:center}
.sline .pf{font-size:7px;padding:4px 5px;background:#000;flex:none}
.sline.l0 .pf{color:#aab0c9}.sline.l1 .pf{color:#5b9bff}.sline.l2 .pf{color:var(--gold)}
.sline.l2{box-shadow:inset 0 0 0 2px var(--gold);color:var(--gold)}
.sline.l9{color:var(--mut)}
#shopBtn{width:100%;padding:10px;font-size:14px;margin-top:4px;line-height:1.5}
.divider{font-size:8px;color:var(--mut);padding:10px 0 2px;border-top:3px dashed #2c3060}
.sec2{font-size:10px;color:#9ad0ff;margin-left:6px;font-weight:700}
.creal{padding:10px 0;border-top:2px dashed #2c3060}.creal:first-of-type{border-top:none}
.creal img{vertical-align:-8px;margin-right:6px}.creal p{font-size:13px;color:#dcdaf2;line-height:1.6;margin:6px 0 2px}
.hudr{display:flex;gap:4px;align-items:center}
#rwIcons{display:flex;gap:1px;align-items:center;font-size:10px}
#mute{padding:5px 7px;font-size:10px}
/* scene */
.scene{padding:0;margin-bottom:10px;overflow:hidden;background:#000}
#scene{width:100%;display:block}
.bubble{position:absolute;left:21%;top:16%;background:#fff;color:#111;font-weight:900;font-size:13px;padding:6px 10px;border:3px solid #000;white-space:nowrap;opacity:0;transform:scale(.6);transition:all .18s;pointer-events:none}
.bubble.on{opacity:1;transform:scale(1)}
.bubble:after{content:'';position:absolute;left:8px;bottom:-9px;border:6px solid transparent;border-top-color:#000}
.combo{position:absolute;right:8px;top:8px;font-size:12px;color:var(--gold);text-shadow:2px 2px 0 #000;display:none;align-items:center;gap:4px;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.billbd{position:absolute;right:8px;bottom:8px;font-size:9px;text-shadow:2px 2px 0 #000;color:#fff}
/* hp */
.lbl{font-size:9px;color:var(--mut)}
#total{font-size:22px;margin:8px 0 2px;text-shadow:3px 3px 0 #000}
.hpbar{height:16px;background:#0a0b1c;border:3px solid #000;position:relative;margin:8px 0 6px}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#7cffb5 0 35%,#2fd47e 35% 70%,#1d9a58 70%);transition:width .25s}
.hpbar.mid i{background:linear-gradient(180deg,#ffe58a 0 35%,#ffc021 35% 70%,#c98a00 70%)}
.hpbar.low i{background:linear-gradient(180deg,#ff9aa4 0 35%,#ff4d5e 35% 70%,#b5243a 70%);animation:blink .4s steps(2) infinite}
.hpbar:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 9px,#0007 9px 11px)}
.hpbar .tg{position:absolute;top:-6px;bottom:-6px;width:3px;background:#fff;box-shadow:0 0 0 1px #000;z-index:2}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.small{font-size:11px;color:var(--mut)}
/* crt */
.crt{padding:8px;margin-bottom:10px;background:#2a2d4f}
.crt-in{background:#060914;border:3px solid #000;box-shadow:inset 0 0 18px #0a1a3a;position:relative;overflow:hidden}
.crt-in:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#ffffff08 2px 3px),radial-gradient(ellipse,#0000 60%,#0008)}
.crt-top{display:flex;justify-content:space-between;padding:6px 8px 0;font-size:9px;color:#6fe3a0}
#chart{width:100%;height:170px;display:block}
.leds{display:flex;gap:5px;justify-content:flex-end;padding:5px 2px 0}
.leds i{width:6px;height:6px;background:#3ddc97;box-shadow:0 0 6px #3ddc97}.leds i+i{background:#ff4d5e;box-shadow:0 0 6px #ff4d5e;animation:blink 1.2s steps(2) infinite}
/* rumor */
.rumor{display:flex;gap:10px;align-items:center;background:#22174a}
.rumor .tx{flex:1;font-size:14px;line-height:1.45;font-weight:700}
.rumor .acc{font-size:9px;color:var(--purple);margin-bottom:5px}
#perkBar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.pchip{display:flex;align-items:center;gap:4px;background:var(--panel2);border:2px solid #000;padding:3px 7px 3px 3px;font-size:11px;font-weight:700}
/* inventory */
.invh{font-size:10px;color:var(--gold)}
.slot{display:grid;grid-template-columns:52px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:3px dashed #2c3060}
.slot:first-child{border-top:none}
.divider+.slot{border-top:none}
.icon{width:52px;height:52px;background:#0e1030;border:3px solid #000;box-shadow:inset 0 0 0 2px #2f3570;display:flex;align-items:center;justify-content:center}
.slot.has .icon{box-shadow:inset 0 0 0 2px var(--gold),0 0 10px #ffd23f55}
.an{font-weight:900;font-size:15px}
.tag{font-size:8px;padding:3px 5px;background:#000;color:var(--gold);margin-left:4px;vertical-align:2px}
.ach{font-size:11px;margin-top:3px}
.ah{text-align:right;font-weight:900;font-size:14px}
.btns{grid-column:1/4;display:flex;gap:4px;margin-top:4px}
.btns button{flex:1;padding:9px 0;font-size:12px}
.up{color:var(--up)}.dn{color:var(--down)}
.lockmsg{font-size:12px;color:#ff8d98;padding:2px 0 8px;font-weight:700}
/* bottom */
.bottom{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--bg) 72%,transparent);padding:14px 10px 16px;z-index:5}
.bottom .in{max-width:480px;margin:0 auto;display:flex;gap:7px}
.sq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px;font-size:9px;min-width:64px}
#next{flex:1;font-size:15px;padding:16px 0}
/* modal */
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
#modal.on{display:flex}
.mbox{max-width:440px;width:100%;max-height:90vh;overflow:auto;text-align:center;padding:20px 16px;animation:pop .3s steps(5)}
@keyframes pop{from{transform:scale(.4)}}
.mbox h2{font-family:'Black Han Sans';font-size:26px;margin:8px 0;text-shadow:3px 3px 0 #000}
.mbox p{color:#d8d6f0;line-height:1.65;font-size:15px}
.dlg{background:#0b0d24;border:3px solid #fff;padding:12px 14px;text-align:left;margin-top:10px;font-size:15px;line-height:1.6;min-height:52px;font-weight:700}
.dlg:after{content:'▼';display:block;text-align:right;font-size:10px;animation:blink .6s steps(2) infinite}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.mbtn{padding:13px;font-size:15px}
.cards{display:flex;gap:7px;margin-top:14px}
.tcg{flex:1;background:#141738;border:3px solid #000;padding:0 0 10px;text-align:center;transition:transform .12s;position:relative;box-shadow:0 4px 0 #000}
.tcg:hover{transform:translateY(-8px)}
.tcg .rb{font-size:8px;padding:6px 0;color:#000}
.tcg .art{margin:10px auto 6px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:#0b0d24;border:2px solid #000}
.tcg .pn{font-weight:900;font-size:13px;margin:4px 4px;min-height:34px;display:flex;align-items:center;justify-content:center}
.tcg .pd{font-size:11px;color:var(--mut);line-height:1.4;padding:0 6px}
.r-일반 .rb{background:#aab0c9}.r-희귀 .rb{background:#5b9bff}.r-전설 .rb{background:var(--gold)}
.r-희귀{box-shadow:0 0 0 2px #5b9bff,0 0 18px #4d8dff66}
.r-전설{box-shadow:0 0 0 2px var(--gold),0 0 26px #ffd23f88;animation:legend 1.2s infinite alternate}
@keyframes legend{to{box-shadow:0 0 0 2px #fff,0 0 34px #ffd23fcc}}
.era{background:#2a1d55;border:3px solid var(--gold);padding:16px;margin:10px 0;animation:flip .7s steps(7) both}
@keyframes flip{from{transform:rotateY(90deg)}}
.era .en{font-family:'Black Han Sans';font-size:25px;color:var(--gold);text-shadow:3px 3px 0 #000}
.cmp{display:flex;justify-content:space-between;font-size:14px;padding:4px 2px}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.ft{position:absolute;font-family:'Press Start 2P';font-size:15px;animation:ft 1.3s steps(12) forwards;text-shadow:3px 3px 0 #000;white-space:nowrap}
@keyframes ft{0%{transform:translate(-50%,0);opacity:0}10%{opacity:1}100%{transform:translate(-50%,-80px);opacity:0}}
.banner{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font-family:'Press Start 2P';font-size:34px;text-shadow:4px 4px 0 #000,-2px -2px 0 #000;animation:bn 1.4s forwards;white-space:nowrap;text-align:center}
.banner small{display:block;font-family:'Black Han Sans';font-size:24px;color:#fff;margin-top:10px}
@keyframes bn{0%{transform:translate(-50%,-50%) scale(3);opacity:0}12%{transform:translate(-50%,-50%) scale(1);opacity:1}18%{transform:translate(-50%,-50%) scale(1.2)}24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;animation:fl .5s steps(4) forwards}
@keyframes fl{from{opacity:.6}to{opacity:0}}
.cf{position:absolute;width:8px;height:8px;top:-12px;animation:cf steps(18) forwards}
@keyframes cf{to{transform:translate(var(--dx),108vh) rotate(var(--r))}}
.coinfx{position:absolute;animation:coin 1s steps(10) forwards}
@keyframes coin{0%{transform:translate(0,0)}40%{transform:translate(var(--dx),-70px)}100%{transform:translate(calc(var(--dx)*1.6),40px);opacity:0}}
.shake{animation:shake .45s steps(9)}
@keyframes shake{10%,90%{transform:translate(-3px,2px)}20%,80%{transform:translate(6px,-3px)}30%,50%,70%{transform:translate(-10px,4px)}40%,60%{transform:translate(10px,-4px)}}
.rewind{position:absolute;inset:0;background:#2b0f5acc;display:flex;align-items:center;justify-content:center;flex-direction:column;animation:fl 1.4s reverse forwards}
.rewind img{animation:spin .4s steps(8) infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.rewind .rt{font-family:'Black Han Sans';font-size:32px;color:#e9d6ff;margin-top:14px;text-shadow:3px 3px 0 #000}
.rewind .rl{position:absolute;left:0;right:0;height:3px;background:#fff6;animation:rl .3s linear infinite}
@keyframes rl{from{top:100%}to{top:0}}
body.sepia .wrap{filter:sepia(.9) hue-rotate(225deg) saturate(1.6) contrast(1.1)}
.stamp{position:absolute;left:50%;top:40%;font-family:'Black Han Sans';font-size:86px;color:var(--up);border:8px solid var(--up);padding:4px 24px;transform:translate(-50%,-50%) rotate(-12deg);animation:stamp .4s steps(4) both;background:#000a;white-space:nowrap;text-shadow:4px 4px 0 #000}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(4);opacity:0}}
/* ending */
#ending .wrap{padding-bottom:40px}
.hero{text-align:center;padding:20px 0 6px}
.hero .hk{font-family:'Black Han Sans';font-size:40px;text-shadow:4px 4px 0 #000;margin-top:8px}
.persona{background:#2a1d55;padding:20px;text-align:center;margin:12px 0}
.persona .pn{font-family:'Black Han Sans';font-size:32px;margin:6px 0;text-shadow:3px 3px 0 #000}
.persona .pt{color:#d9b8ff;font-weight:700}
.persona .pdsc{margin-top:10px;color:#dcdaf2;line-height:1.7;font-size:14px}
.gb2{display:flex;gap:8px;margin-top:12px;text-align:left;font-size:13px}
.gb2>div{flex:1;background:#141738;border:3px solid #000;padding:9px}
.sec{font-size:12px;color:var(--gold);margin:22px 0 10px;text-shadow:2px 2px 0 #000}
.ev li{list-style:none;padding:8px 0;border-top:2px dashed #2c3060;display:flex;justify-content:space-between;font-size:13px}
.ev li:first-child{border-top:none}
.gh{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0}
.gh .gl{width:112px;flex:none}
.gh .gb{flex:1;height:12px;background:#0a0b1c;border:2px solid #000;position:relative}
.gh .gb i{position:absolute;top:0;bottom:0}
.gh .gb:before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:#555a8a}
.gh .gv{width:58px;text-align:right;font-weight:900}
.gh.me .gl{color:var(--gold);font-weight:900}
.rep canvas{width:100%;height:140px;display:block;margin:8px 0;background:#060914;border:3px solid #000}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.dx{background:#141738;border:3px solid #000;padding:9px 4px;text-align:center;font-size:12px;min-height:70px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;color:#555a8a}
.dx.on{background:#2a1d55;color:var(--gold);font-weight:900;box-shadow:inset 0 0 0 2px var(--gold)}
.dx.new{animation:legend .8s infinite alternate}
.rk li{list-style:none;display:flex;gap:10px;padding:9px 4px;border-top:2px dashed #2c3060;font-size:13px;align-items:center}
.rk li:first-child{border-top:none}
.rk li .no{width:26px;font-size:10px;color:var(--mut)}
.rk li.top .no{color:var(--gold)}
.rk li .nm{flex:1}
.rk li .nm small{display:block;color:var(--mut);font-size:11px}
.rk li.me{background:#ffd23f22}
.in1{display:flex;gap:6px;margin-top:10px}
.in1 input{flex:1;background:#0b0d24;border:3px solid #000;padding:10px;color:var(--txt);font-family:inherit;font-size:14px}
.in1 button{padding:0 16px;font-size:13px}
.chal{background:#3a2608;border:3px solid #000;box-shadow:inset 0 0 0 2px #8a5a10;padding:12px 14px;font-size:14px;line-height:1.6}
.note{font-size:11px;color:#5d608a;text-align:center;margin-top:18px;line-height:1.6}
.ok{color:var(--green)}
</style>
</head>
<body>
<div id="fx"></div>

<!-- INTRO -->
<section id="intro" class="screen on"><div class="wrap">
  <div class="px scene titlebox"><canvas id="introScene" class="px8" width="160" height="72"></canvas></div>
  <div class="pf logo-top">ANTERNAL<br>RETURN</div>
  <p class="sub">눈을 떠보니 과거 어느 해의 증시 한복판.<br>몇 년도인지는 아무도 알려주지 않는다.<br><b style="color:var(--txt)">살아남아라, 개미여.</b></p>
  <div class="px panel rules" id="rules"></div>
  <div id="introInfo"></div>
  <button class="pbtn gold press pf" id="startBtn"><span class="blink">▶ PRESS START</span></button>
  <p class="note">차트는 실제 과거 지수 흐름을 근사해 20주로 압축한 게임용 데이터예요.<br>큰 흐름은 실제와 같고, 잔파동은 매판 달라져요.</p>
</div></section>

<!-- GAME -->
<section id="game" class="screen"><div class="wrap" id="gw">
  <div class="hud">
    <div class="px stb pf" id="stg">WEEK 1/30</div>
    <div class="weeks" id="weeks"></div>
    <div class="hudr"><span id="rwIcons"></span><button class="pbtn dark pf" id="mute">♪</button></div>
  </div>
  <div class="px scene"><canvas id="scene" class="px8" width="160" height="64"></canvas><div class="bubble" id="bubble"></div><div class="combo pf" id="combo"></div><div class="billbd pf" id="wk"></div></div>
  <div class="px panel">
    <div class="row"><span class="lbl pf">ACCOUNT HP</span><span class="small" id="cash"></span></div>
    <div id="total" class="pf">₩10,000,000</div>
    <div class="hpbar" id="hp"><i id="barI"></i><span class="tg" id="barT"></span></div>
    <div class="row small"><span id="danger"></span><span id="goal"></span></div>
  </div>
  <div class="px crt"><div class="crt-in"><div class="crt-top pf"><span id="era">YEAR ????</span><span id="idxv">IDX 100.0</span></div><canvas id="chart"></canvas><div class="ticker" id="ticker"></div></div><div class="leds"><i></i><i></i></div></div>
  <div class="px panel rumor"><span id="rIcon"></span><div class="tx"><div class="acc pf" id="racc">RUMOR 60%</div><div id="rtx"></div></div></div>
  <div class="px panel shop"><div class="row"><span class="invh pf">INFO SHOP · 정보상</span><span class="small" id="shopT"></span></div><div id="shopLines"></div><button class="pbtn purp" id="shopBtn"></button></div>
  <div id="perkBar"></div>
  <div class="px panel"><div class="row" style="margin-bottom:4px"><span class="invh pf">INVENTORY</span></div><div id="assets"></div></div>
  <div class="bottom"><div class="in">
    
    <button class="pbtn gold sq pf" id="peekBtn" style="display:none"></button>

const SKY={

function genCity(seed){const r=mulberry32(seed|0),far=[],near=[];let x=-2;while(x<170){const w=6+(r()*10|0);far.push({x,w,h:16+(r()*24|0)});x+=w+(r()*2|0)}

 let bi=near.findIndex(b=>b.x>70&&b.w>=16);if(bi<0)bi=4;near[bi].h=Math.max(near[bi].h,24);return{far,near,bi}}
class Scene{
 constructor(cv){this.cv=cv;this.c=cv.getContext('2d');this.W=cv.width;this.H=cv.height;this.mood='night';this.ant='cool';this.jump=0;this.t=0;this.city=genCity(Math.random()*1e9);this.board='';this.bcol='#fff';this.flash=0;this.drops=[];this.stars=Array.from({length:30},()=>[Math.random()*this.W|0,Math.random()*this.H*.5|0]);this.antX=16}
 draw(){
  const c=this.c,W=this.W,H=this.H,t=++this.t,sky=SKY[this.mood]||SKY.flat;c.imageSmoothingEnabled=false;
  const bh=Math.ceil(H/4);sky.forEach((col,i)=>{c.fillStyle=col;c.fillRect(0,i*bh,W,bh)});
  for(let i=1;i<4;i++){c.fillStyle=sky[i];for(let x=0;x<W;x+=2){c.fillRect(x+(i%2),i*bh-1,1,1)}c.fillStyle=sky[i-1];for(let x=1;x<W;x+=2)c.fillRect(x,i*bh,1,1)}
  const m=this.mood;
  if(m==='night'||m==='flat'){this.stars.forEach(([x,y],i)=>{if((t+i*7)%40<34){c.fillStyle=i%5?'#fff8':'#fff';c.fillRect(x,y,1,1)}});c.fillStyle='#fff3c4';c.fillRect(W-30,6,9,9);c.fillRect(W-31,7,11,7);c.fillStyle=sky[0];c.fillRect(W-27,5,8,8)}
  if(m==='up'||m==='moon'){const sx=W-28,sy=12,r=m==='moon'?8:6;c.fillStyle=m==='moon'?'#fff1a8':'#ffe066';c.fillRect(sx-r,sy-r+2,r*2,r*2-4);c.fillRect(sx-r+2,sy-r,r*2-4,r*2);
   if(t%10<5){c.fillStyle='#fff6';c.fillRect(sx-r-4,sy,2,1);c.fillRect(sx+r+2,sy,2,1);c.fillRect(sx,sy-r-4,1,2);c.fillRect(sx,sy+r+2,1,2)}}
  if(m==='down'||m==='crash'){c.fillStyle=m==='crash'?'#3a1420':'#2b3150';for(let i=0;i<5;i++){const cx=((i*40+t*.4)%(W+40))-30;c.fillRect(cx,4+i%2*5,26,6);c.fillRect(cx+4,1+i%2*5,16,4)}}
  // far
  c.fillStyle=m==='up'?'#4a64a8':m==='moon'?'#a85a5a':'#151933';this.city.far.forEach(b=>c.fillRect(b.x,H-6-b.h,b.w,b.h));
  // near
  this.city.near.forEach((b,bi)=>{const y=H-6-b.h;c.fillStyle=b.col;c.fillRect(b.x,y,b.w,b.h);c.fillStyle='#0004';c.fillRect(b.x+b.w-2,y,2,b.h);c.fillStyle='#fff1';c.fillRect(b.x,y,b.w,1);
   let k=0;for(let wy=y+3;wy<H-8;wy+=3)for(let wx=b.x+2;wx<b.x+b.w-3;wx+=3){const v=b.win[k++%60];const lit=m==='crash'?v<.15:m==='up'||m==='moon'?v<.25:v<.5;if(lit&&!(v<.05&&t%30<4)){c.fillStyle=m==='crash'?'#ff5a6a':'#ffd86b';c.fillRect(wx,wy,1,1)}}
   if(bi===this.city.bi){const bw=32,bx=Math.round(b.x+b.w/2-16),by=y-11;c.fillStyle='#000';c.fillRect(bx,by,bw,10);c.fillStyle='#555';c.fillRect(bx+bw/2-1|0,by+10,2,2);
    c.fillStyle=this.bcol;c.font='bold 7px monospace';c.textBaseline='top';const txt=this.board||'STOCK';const tw=c.measureText(txt).width;c.fillText(txt,bx+(bw-tw)/2|0,by+2)}});
  // ground
  c.fillStyle='#1d2140';c.fillRect(0,H-6,W,6);c.fillStyle='#3a4070';c.fillRect(0,H-6,W,1);for(let x=(-t)%12;x<W;x+=12){c.fillStyle='#2a2f58';c.fillRect(x,H-3,6,1)}
  // weather
  if(m==='down'||m==='crash'){if(this.drops.length<(m==='crash'?70:40))this.drops.push([Math.random()*W,-4]);c.fillStyle='#8fb2ff99';this.drops.forEach(d=>{d[1]+=3;d[0]-=.6;c.fillRect(d[0]|0,d[1]|0,1,3)});this.drops=this.drops.filter(d=>d[1]<H)}else this.drops=[];
  if(m==='crash'&&t%55<3){this.flash=3}
  if(m==='up'||m==='moon'){for(let i=0;i<(m==='moon'?8:3);i++){c.fillStyle=['#fff','#ffe066','#ff8ab0'][i%3];c.fillRect(Math.random()*W|0,Math.random()*H*.6|0,1,1)}}
  // ant
  let jy=0;if(this.jump>0){jy=Math.round(Math.abs(Math.sin(this.jump/9*Math.PI*2))*10);this.jump--}
  const bob=(t>>3)%2,img=sprCanvas('ant:'+this.ant);c.drawImage(img,this.antX,H-6-16-jy+(this.jump?0:bob));
  c.fillStyle='#0005';c.fillRect(this.antX+4,H-6,8,1);
  if(this.flash>0){c.fillStyle=`rgba(255,255,255,${this.flash/4})`;c.fillRect(0,0,W,H);this.flash--}
  if(this.sepia){c.fillStyle='#6b2fc055';c.fillRect(0,0,W,H)}
 }
}

 leap:{n:'타임리프 숙련',s:'heart',r:'희귀',d:'회귀 발동 기준: 한 주 -10% → -6%'}
};
const START=1e7, TURNS=30, DPT=5, CHESTS=[10,20];
const HEAD={
 up:['외국인 3일 연속 순매수 조짐','증권가 "바닥 찍었다" 리포트 쏟아져','중앙은행 금리 인하 시사설','큰손들 조용히 매집 중이라는 소문','공매도 세력 숏커버링 루머'],
 down:['대형 헤지펀드 청산설 돌아','신용 반대매매 물량 폭탄 경고','해외 은행 부실 루머 확산','외국인 대규모 매도 예고설','"이번 주 피바다" 지라시 돌아'],
 flat:['관망세 짙어져… 거래량 실종','큰 이벤트 없이 눈치보기 장세','방향성 없는 박스권 예상']
};
const CHEAD={
 up:a=>[`${a}, 대형 계약 체결 임박`,`${a}, 실적 서프라이즈 예고`,`외국인, ${a} 집중 매수 조짐`,`${a} 목표주가 일제히 상향`],
 down:a=>[`${a}, 실적 쇼크 우려`,`${a} 대주주 지분 매각설`,`${a}, 규제 리스크 부각`,`기관, ${a} 대량 매도 조짐`],
 flat:a=>[`${a}, 당분간 횡보 전망`,`${a} 관련 특이사항 없음`]
};

/* ========= state ========= */
let run=null, st=null, busy=false, EP=null;
const P=k=>run.perks[k]||0;
function genSeries(o,rng){
 const N=TURNS*DPT,k=o.k,idx=k.map(([t])=>Math.round(t*N)),lv=k.map(([,v])=>Math.log(v));
 const base=[],adj=[],w=[0],vol=o.vol/100*(o.comp?.9:1.15);
 for(let i=1;i<=N;i++)w[i]=w[i-1]+gauss(rng)*vol;
 for(let j=0;j<k.length-1;j++){const a=idx[j],b=idx[j+1];for(let i=a;i<=b;i++){const f=b===a?0:(i-a)/(b-a);base[i]=lv[j]+(lv[j+1]-lv[j])*f;adj[i]=w[i]-(w[a]+(w[b]-w[a])*f)}}
 const p=base.map((v,i)=>Math.exp(v+adj[i]));return p.map(v=>v/p[0]*100);
}
const evWeek=t=>Math.min(TURNS-1,Math.floor(t*TURNS));
function newRun(){
 const epi=Math.floor(Math.random()*EPS.length);EP=EPS[epi];
 const seed=Math.floor(Math.random()*1e9),rng=mulberry32(seed);
 ASSETS=[...BASE_ASSETS,...EP.comps.map((c,i)=>({id:'c'+i,n:c.alias,s:'bldg',tag:c.sec,ci:i}))];
 run={epi,perks:{},rewinds:1,dexNew:[],chests:{},
  stats:{trades:0,buys:0,sells:0,turns:0,cashSum:0,levSum:0,invSum:0,panic:0,dip:0,chase:0,rewinds:0,maxCombo:0,peak:START,mdd:0,events:0,infoBuys:0,infoSpent:0}};
 const p=genSeries(EP,rng),cp=EP.comps.map(c=>genSeries({...c,comp:1},rng));
 const rumU=[],rumU2=[],rumH=[],ev=[],evU=[],infoC=[],iu1=[],iu2=[],ih=[];
 for(let t=0;t<TURNS;t++){
  rumU[t]=rng();rumU2[t]=rng();rumH[t]=rng();evU[t]=rng();ev[t]=(t>0&&t<TURNS-1&&rng()<.17)?Math.floor(rng()*EVENTS.length):-1;
  const withEv=EP.comps.map((c,i)=>c.ev.some(e=>evWeek(e[0])===t)?i:-1).filter(i=>i>=0);
  infoC[t]=withEv.length?withEv[Math.floor(rng()*withEv.length)]:Math.floor(rng()*EP.comps.length);iu1[t]=rng();iu2[t]=rng();ih[t]=rng();
 }
 const hold={idx:0,lev:0,inv:0};EP.comps.forEach((_,i)=>hold['c'+i]=0);
 st={p,cp,rumU,rumU2,rumH,ev,evU,infoC,iu1,iu2,ih,turn:0,cash:START,hold,debt:0,combo:0,peek:0,marks:[],lock:false,snaps:[],lastMkt:0,lastA:{},info:{lv:0,lines:[]},news:[]};
 show('game');
 SC.city=genCity(seed);SC.mood='flat';SC.ant='neutral';SC.board='????';SC.bcol='#ffd23f';
 snapshot();render();
 setTimeout(()=>{banner('START!','var(--gold)','어느 시대인지 알아내고, 시장을 이겨라');say('start')},250);
}

/* ========= core ========= */
const invested=()=>Object.values(st.hold).reduce((a,b)=>a+b,0);
const asset=()=>st.cash+invested();
const bankLine=()=>START*(P('mental')?.25:.4);
const rwLine=()=>P('leap')?.06:.1;
function ar(id,d){if(id[0]==='c'){const c=st.cp[+id[1]];return c[d]/c[d-1]-1}const r=st.p[d]/st.p[d-1]-1;return id==='idx'?r:id==='lev'?Math.max(-.95,2*r):-r}
const mktWeek=t=>st.p[(t+1)*DPT]/st.p[t*DPT]-1;
const compWeek=(i,t)=>st.cp[i][(t+1)*DPT]/st.cp[i][t*DPT]-1;
const dirOf=R=>R>.012?'up':R<-.012?'down':'flat';
const flip=(d,u)=>d==='up'?'down':d==='down'?'up':(u<.5?'up':'down');
function rumor(t){const real=dirOf(mktWeek(t));let dir=real;if(st.rumU[t]>=.6){const o=['up','down','flat'].filter(x=>x!==real);dir=o[Math.floor(st.rumU2[t]*2)]}const pool=HEAD[dir];return{dir,text:pool[Math.floor(st.rumH[t]*pool.length)]}}
function snapshot(){st.snaps[st.turn]=JSON.stringify({cash:st.cash,hold:st.hold,debt:st.debt,combo:st.combo,marks:st.marks,peek:st.peek,lastMkt:st.lastMkt,lastA:st.lastA,info:st.info,news:st.news})}

function trade(id,side,frac,el){
 if(busy||st.lock)return;
 const fee=P('nofee')?0:.001,d=st.turn*DPT;
 if(side==='b'){const amt=st.cash*frac;if(amt<1000)return;st.cash-=amt;st.hold[id]+=amt*(1-fee);run.stats.buys++;if(st.lastMkt<=-.03)run.stats.dip++;if(st.lastMkt>=.03)run.stats.chase++;sfx.buy();coinBurst(el,4)}
 else{const amt=st.hold[id]*frac;if(amt<1)return;st.hold[id]-=amt;if(st.hold[id]<1)st.hold[id]=0;st.cash+=amt*(1-fee);run.stats.sells++;if(st.lastMkt<=-.03)run.stats.panic++;sfx.sell()}
 run.stats.trades++;st.marks.push({d,s:side,a:id});render();
}

/* ===== 정보상 (런닝맨 '투자의 귀재들' 방식) ===== */
const INFO_NAME=['업계 소문','기자의 특종','내부자 쪽지'];
function infoCost(lv){return Math.max(30000,Math.round(asset()*[.005,.015,.04][lv]*(P('vip')?.6:1)/1000)*1000)}
function buyInfo(){
 if(busy||st.turn>=TURNS)return;const lv=st.info.lv;if(lv>=3)return;
 const cost=infoCost(lv);if(st.cash<cost){floatText('현금 부족!','var(--down)');sfx.crash();return}
 st.cash-=cost;run.stats.infoBuys++;run.stats.infoSpent+=cost;
 const t=st.turn,ci=st.infoC[t],c=EP.comps[ci],R=compWeek(ci,t),real=dirOf(R);let line;
 if(lv===0){const d=st.iu1[t]<.6?real:flip(real,st.ih[t]);line=d==='up'?`"${c.alias} 쪽에 좋은 소식이 있다던데…"`:d==='down'?`"${c.alias} 쪽 분위기가 영 안 좋다던데…"`:`"${c.alias}는 이번 주 조용할 거라던데…"`}
 else if(lv===1){const d=st.iu2[t]<(P('scoop')?.95:.8)?real:flip(real,st.ih[t]);const e=c.ev.find(e=>evWeek(e[0])===t&&e[1]===d);const pool=CHEAD[d](c.alias);line=`[단독] ${e?e[2]:pool[Math.floor(st.ih[t]*pool.length)]}`}
 else line=`${c.alias} 다음 주 ${pct(R)} — 이건 확실해.`;
 st.info.lines.push({lv,t:line});st.info.lv++;
 lv===2?sfx.big():sfx.coin();if(lv===2)flash('#b26bff');render();
}

async function nextWeek(){
 if(busy)return;busy=true;sfx.click();
 const s=run.stats,A0=asset();s.turns++;s.cashSum+=st.cash/A0;s.levSum+=st.hold.lev/A0;s.invSum+=st.hold.inv/A0;
 const t=st.turn,aStart={};ASSETS.forEach(a=>aStart[a.id]=1);
 let stopped=false;render();
 for(let i=1;i<=DPT;i++){
  const d=t*DPT+i;
  for(const a of ASSETS){const r=ar(a.id,d);st.hold[a.id]*=1+r;aStart[a.id]*=1+r}
  st.day=d;
  if(P('stop')&&!stopped&&invested()>0&&asset()<A0*.93){stopped=true;for(const k in st.hold){st.cash+=st.hold[k];st.hold[k]=0}floatText('손절봇 발동!','var(--purple)');sfx.sell()}
  const A=asset();s.peak=Math.max(s.peak,A);s.mdd=Math.max(s.mdd,1-A/s.peak);
  const dr=st.p[d]/st.p[t*DPT]-1;SC.board=pct(dr);SC.bcol=dr>=0?'#ff5a6a':'#6aa0ff';
  sfx.tick(st.p[d]>=st.p[d-1]);render(d);
  if(A<bankLine()){await sleep(250);if(run.rewinds>0&&await offerRewind('death'))return doRewind(t);return bankrupt()}
  await sleep(170);
 }
 if(P('park')&&st.cash>0)st.cash*=1+.004*P('park');
 if(P('div'))st.cash+=(invested()-st.hold.inv)*.003*P('div');
 const A1=asset(),R=A1/A0-1;st.lastMkt=mktWeek(t);
 ASSETS.forEach(a=>st.lastA[a.id]=aStart[a.id]-1);
 st.news=[];EP.comps.forEach((c,i)=>c.ev.forEach(e=>{if(evWeek(e[0])===t)st.news.push(`${e[2]} (${c.alias} ${pct(st.lastA['c'+i])})`)}));
 weekFx(R,A1-A0,st.lastMkt);
 if(R<=-rwLine()&&run.rewinds>0){await sleep(1100);if(await offerRewind('crash',R))return doRewind(t)}
 if(R>.001&&invested()>0){st.combo++;s.maxCombo=Math.max(s.maxCombo,st.combo);
  const B={3:.01,5:.02,8:.03,12:.05,16:.07}[st.combo];
  if(B){const bonus=asset()*B*(P('combo')?2:1);st.cash+=bonus;setTimeout(()=>{banner(`COMBO x${st.combo}`,'var(--gold)',`콤보 보너스 +${fmt(bonus)}`);sfx.big();confetti(['#ffd23f','#ff8a1f','#fff']);render()},750)}}
 else st.combo=0;
 st.turn++;st.lock=false;st.info={lv:0,lines:[]};
 if(st.turn>=TURNS){render();await sleep(1000);return finishRun(null)}
 snapshot();render();
 await sleep(Math.abs(R)>=.04?950:350);
 if(CHESTS.includes(st.turn)&&!run.chests[st.turn]){run.chests[st.turn]=1;await perkPick()}
 if(P('dream')&&!run.dreamGiven){run.dreamGiven=1;st.peek=2}
 busy=false;render();
 triggerEvent(st.turn);
}

function weekFx(R,dv,mkt){
 SC.mood=mkt>=.06?'moon':mkt>=.01?'up':mkt<=-.06?'crash':mkt<=-.01?'down':'flat';
 SC.ant=R>=.005?'happy':R<=-.06?'shock':R<=-.005?'sad':'neutral';
 if(Math.abs(dv)>=1)floatText((dv>=0?'+':'')+fmt(dv),dv>=0?'var(--up)':'var(--down)');
 if(R>=.1){banner(pct(R),'var(--up)','떡상!!');sfx.big();confetti();flash('#ff4d5e');SC.jump=18;say('moon')}
 else if(R>=.04){banner(pct(R),'var(--up)','나이스!');sfx.win();confetti(['#ff4d5e','#ffd23f','#fff'],30);SC.jump=9;say('happy')}
 else if(R<=-.1){banner(pct(R),'var(--down)','대폭락');sfx.crash();shake();flash('#1a4dff');say('shock')}
 else if(R<=-.04){banner(pct(R),'var(--down)','아야…');sfx.crash();shake();say('sad')}
 else if(R>.005)say('happy');else if(R<-.005)say('sad');
}
function offerRewind(kind,R){
 return new Promise(res=>{
  sfx.rewind();SC.sepia=true;
  const head=kind==='death'?`${S('ant:cry',80)}<h2>계좌가 녹아내렸다…</h2><div class="dlg tw">눈앞이 깜깜해진다. 그런데 주머니 속 모래시계가 빛나기 시작한다…</div>`
   :`${S('hourglass',80)}<h2>이번 주 ${pct(R)}</h2><div class="dlg tw">충격이 너무 크다. 주머니 속 모래시계가 빛나기 시작한다…</div>`;
  modal(head+`<p class="small" style="margin-top:10px">회귀권 ${run.rewinds}개 → ${run.rewinds-1}개 · 이번 주를 처음부터 다시</p>`,[
   {l:'⏪ 1주 전으로 회귀한다',c:'purp',f:()=>res(true)},
   {l:kind==='death'?'받아들인다 (게임 오버)':'그냥 간다',c:'dark',f:()=>{SC.sepia=false;res(false)}}]);
 });
}
function doRewind(t){
 run.rewinds--;run.stats.rewinds++;busy=true;
 const fx=document.createElement('div');fx.className='rewind';fx.innerHTML=`<div class="rl"></div>${S('hourglass',110)}<div class="rt">1주 전으로 회귀…</div>`;$('#fx').appendChild(fx);
 document.body.classList.add('sepia');SC.sepia=true;
 setTimeout(()=>{
  const o=JSON.parse(st.snaps[t]);Object.assign(st,o);st.turn=t;st.snaps.length=t+1;st.lock=false;st.day=t*DPT;
  busy=false;SC.sepia=false;SC.mood='flat';SC.ant='cool';SC.board='REWIND';SC.bcol='#d9b8ff';render();document.body.classList.remove('sepia');fx.remove();
  banner('REWIND','#d9b8ff','이번 주의 기억은 남아있다');say('rewind');
  if(st.ev[t]>=0)setTimeout(()=>triggerEvent(t,true),1300);
 },1400);
}
function peek(){
 if(busy||st.peek<1)return;st.peek--;sfx.coin();const R=mktWeek(st.turn);
 modal(`${S('crystal',72)}<h2>예지몽</h2><div class="dlg tw">꿈속에서 다음 주 지수를 봤다…</div><div class="pf ${cls(R)}" style="font-size:30px;margin-top:16px;text-shadow:3px 3px 0 #000">${pct(R)}</div>`,[{l:'기억했다',c:'gold'}]);render();
}
function bankrupt(){
 sfx.dread();shake();flash('#000');SC.mood='crash';SC.ant='cry';SC.board='GAME OVER';SC.bcol='#ff4d5e';say('shock');
 const s=document.createElement('div');s.className='stamp';s.textContent='깡 통';$('#fx').appendChild(s);
 for(const k in st.hold)st.hold[k]=0;st.cash=Math.max(0,asset());render();
 setTimeout(()=>{s.remove();finishRun('깡통')},2000);
}
function ghosts(p){
 const N=TURNS*DPT,end=p[N],hodl=end/p[0]-1;
 let dca=0;for(let w=0;w<TURNS;w++)dca+=(1/TURNS)*end/p[w*DPT];
 let c=.7,u=.3/p[0];
 for(let w=1;w<TURNS;w++){const r=p[w*DPT]/p[(w-1)*DPT]-1,px=p[w*DPT];
  if(r<=-.04&&c>0){const b=Math.min(c,.2);c-=b;u+=b/px}else if(r>=.05&&u>0){const sv=Math.min(u*px,.2);u-=sv/px;c+=sv}}
 return[{n:'존버 (지수 100%)',r:hodl},{n:'매주 적립식',r:dca-1},{n:'역발상 고수',r:c+u*end-1},{n:'현금 100%',r:0}];
}
function finishRun(reason){
 busy=true;
 for(const k in st.hold){st.cash+=st.hold[k];st.hold[k]=0}
 if(st.debt&&reason!=='깡통'){st.cash-=st.debt;floatText(`빚 상환 -${fmt(st.debt)}`,'var(--down)')}
 const dex=LS.get('antRegDex',[]);if(!dex.includes(EP.id)){dex.push(EP.id);LS.set('antRegDex',dex);run.dexNew.push(EP.id)}
 run.upto=reason==='깡통'?st.day:TURNS*DPT;
 const opts=shuffle([run.epi,...shuffle(EPS.map((_,i)=>i).filter(i=>i!==run.epi)).slice(0,2)]);
 const head=reason==='깡통'?`${S('ant:cry',80)}<h2>깡통…</h2><div class="dlg tw">하지만 마지막으로 알아맞혀 봐. 여긴 몇 년도였을까?</div>`:`${S('trophy',80)}<h2>30주 생존!</h2><div class="dlg tw">당신이 버틴 이 장은… 몇 년도였을까? 기업 가명이 힌트야.</div>`;
 modal(head+`<p class="small" style="margin-top:8px">맞히면 보너스 +3%</p>`,opts.map(i=>({l:EPS[i].short,c:'dark',f:()=>{const ok=i===run.epi;if(ok&&st.cash>0){st.cash*=1.03;sfx.win()}else sfx.dread();ending(reason,ok)}})));
}
async function perkPick(){
 return new Promise(res=>{
  const pool=Object.keys(PERKS).filter(k=>PERKS[k].stack||!P(k)),w={일반:60,희귀:30,전설:10},pick=[];
  while(pick.length<3&&pick.length<pool.length){let tot=0;const c=pool.filter(k=>!pick.includes(k));c.forEach(k=>tot+=w[PERKS[k].r]);let r=Math.random()*tot;for(const k of c){r-=w[PERKS[k].r];if(r<=0){pick.push(k);break}}}
  sfx.coin();const box=$('#mbox');$('#modal').classList.add('on');
  box.innerHTML=`<p class="pf" style="font-size:9px;color:var(--gold)">WEEK ${st.turn} SUPPLY</p>${S('chest',72)}<h2>보급 상자 도착!</h2><p class="small">남은 기간을 함께할 능력 하나</p><div class="cards">${pick.map(k=>{const p=PERKS[k];return`<button class="tcg r-${p.r}" data-k="${k}"><div class="rb pf">${p.r==='전설'?'LEGEND':p.r==='희귀'?'RARE':'NORMAL'}</div><div class="art">${S(p.s,48)}</div><div class="pn">${p.n}</div><div class="pd">${p.d}</div></button>`}).join('')}</div>`;
  box.querySelectorAll('.tcg').forEach(b=>b.onclick=()=>{const k=b.dataset.k;run.perks[k]=(run.perks[k]||0)+1;if(k==='rw1')run.rewinds+=1;if(k==='rw2')run.rewinds+=2;
   PERKS[k].r==='전설'?sfx.big():sfx.win();closeModal();render();res()});
 });
}

/* ========= events ========= */
const EVENTS=[
 {s:'seven',t:'친구의 급등주 정보',d:'"야 이거 내일 상한가 간다. 진짜임." 현금 20%를 걸어볼까?',ch:[{l:'걸어본다 (45% 확률 2.5배)',c:'red',f:u=>{const b=st.cash*.2;if(b<1000)return'현금이 없어서 못 걸었다…';st.cash-=b;if(u<.45){st.cash+=b*2.5;sfx.big();confetti();SC.jump=12;return`대박!! ${fmt(b*2.5)} 회수!`}st.cash+=b*.3;sfx.crash();shake();SC.ant='shock';return`물렸다… ${fmt(b*.3)}만 건졌다.`}},{l:'무시한다',c:'dark',f:()=>'현명한 선택일지도?'}]},

function drawChart(cv,p,upto,marks,ann){
 const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(!w)return;cv.width=w*dpr;cv.height=h*dpr;
 const c=cv.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);
 const N=p.length-1,vis=p.slice(0,upto+1);let mn=Math.min(...vis,100),mx=Math.max(...vis,100);const pad=(mx-mn)*.14+1;mn-=pad;mx+=pad;
 const X=i=>8+(w-16)*i/N,Y=v=>h-12-(h-30)*(v-mn)/(mx-mn);
 c.fillStyle='#13203a';for(let i=0;i<=N;i+=DPT)for(let y=8;y<h-8;y+=6)c.fillRect(Math.round(X(i)),y,1,2);
 c.fillStyle='#2c4a6a';for(let x=8;x<w-8;x+=6)c.fillRect(x,Math.round(Y(100)),3,1);
 const col=vis[vis.length-1]>=100?'#ff4d5e':'#4d8dff';
 if(ann)ann.forEach(([t,l],ai)=>{const i=Math.round(t*N);if(i>upto)return;c.fillStyle='#ffd23f88';for(let y=6;y<h-8;y+=4)c.fillRect(Math.round(X(i)),y,1,2);c.fillStyle='#ffd23f';c.font='bold 10px Noto Sans KR';const tw=c.measureText(l).width;c.fillText(l,Math.min(Math.max(X(i)-tw/2,2),w-tw-2),12+(ai%2)*13)});
 const path=()=>{c.beginPath();vis.forEach((v,i)=>{const x=Math.round(X(i)),y=Math.round(Y(v));if(!i)c.moveTo(x,y);else{c.lineTo(x,Math.round(Y(vis[i-1])));c.lineTo(x,y)}})};
 path();c.lineTo(Math.round(X(upto)),h);c.lineTo(Math.round(X(0)),h);c.closePath();const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');c.fillStyle=g;c.fill();
 path();c.strokeStyle=col;c.lineWidth=2;c.shadowColor=col;c.shadowBlur=8;c.stroke();c.shadowBlur=0;
 (marks||[]).forEach(m=>{if(m.d>upto)return;const x=Math.round(X(m.d)),y=Math.round(Y(p[m.d]));c.fillStyle=m.s==='b'?'#ff4d5e':'#4d8dff';
  if(m.s==='b'){c.fillRect(x-1,y+6,3,3);c.fillRect(x-3,y+9,7,3);c.fillRect(x-5,y+12,11,2)}else{c.fillRect(x-1,y-9,3,3);c.fillRect(x-3,y-12,7,3);c.fillRect(x-5,y-14,11,2)}});
 const lx=Math.round(X(upto)),ly=Math.round(Y(vis[vis.length-1]));c.fillStyle='#fff';c.fillRect(lx-3,ly-3,6,6);c.fillStyle=col;c.fillRect(lx-2,ly-2,4,4);
}

 return Object.entries(sc).sort((a,b)=>b[1]-a[1])[0][0];
}

 const evid=[['주당 평균 매매',(s.trades/T).toFixed(1)+'회'],['평균 현금 비중',Math.round(s.cashSum/T*100)+'%'],['레버리지 평균 비중',Math.round(s.levSum/T*100)+'%'],['인버스 평균 비중',Math.round(s.invSum/T*100)+'%'],['정보 구매',s.infoBuys+'회 · '+fmt(s.infoSpent)],['폭락 주 다음 매도 (패닉셀)',s.panic+'회'],['폭락 주 다음 매수 (줍줍)',s.dip+'회'],['급등 주 다음 매수 (추격)',s.chase+'회'],['최대 낙폭 (MDD)','-'+Math.round(s.mdd*100)+'%'],['최대 콤보','x'+s.maxCombo],['회귀권 사용',s.rewinds+'회']];
 const N=TURNS*DPT;
 $('#endw').innerHTML=`
 <div class="hero">${S(reason==='깡통'?'ant:cry':alpha>=0?'trophy':'ant:sad',96)}
  <div class="pf" style="font-size:11px;color:var(--mut);margin-top:10px">${reason==='깡통'?'GAME OVER':'30 WEEKS SURVIVED'}</div>
  <div class="hk" style="color:${alpha>=0?'var(--gold)':'var(--down)'}">${reason==='깡통'?'깡통 엔딩':alpha>=0?'시장을 이겼다!':'시장에 졌다…'}</div>
  <div class="pf" style="font-size:20px;margin-top:10px;text-shadow:3px 3px 0 #000">${fmt(final)}</div>
  <div style="font-weight:900;margin-top:6px"><span class="${cls(ret)}">수익률 ${pct(ret)}</span> · <span class="${cls(alpha)}">시장 대비 ${alpha>=0?'+':''}${alpha.toFixed(1)}%p</span></div>
  <div class="small" style="margin-top:4px">${guessOk?'시대 맞히기 성공 +3% 포함':'시대 맞히기 실패'}</div></div>
 <div class="sec pf">▶ REVEAL · 정답 공개</div>
 <div class="era"><div class="small">사실 이 장은…</div><div class="en">${EP.name}</div><div class="small">${EP.period}</div><p style="margin-top:10px;font-size:14px">${EP.lesson}</p></div>
 <div class="px panel rep"><b>내 매매 리플레이</b>
  <canvas id="repc"></canvas><div class="small" style="margin-bottom:8px">▲ 내 매수 · ▼ 내 매도 · 노란 선 = 실제 사건</div>
  ${all.map(g=>`<div class="gh ${g.me?'me':''}"><span class="gl">${g.n}</span><span class="gb"><i style="left:${g.r>=0?50:50-Math.abs(g.r)/m*50}%;width:${Math.abs(g.r)/m*50}%;background:${g.r>=0?'var(--up)':'var(--down)'}"></i></span><span class="gv ${cls(g.r)}">${pct(g.r)}</span></div>`).join('')}</div>
 <div class="px panel"><b>가명 속 진짜 기업</b>
  ${EP.comps.map((c,i)=>{const r=st.cp[i][run.upto]/st.cp[i][0]-1,n=st.marks.filter(x=>x.a==='c'+i).length;return`<div class="creal"><div class="row"><span>${S('bldg',28)}<b>${c.alias}</b> → <b style="color:var(--gold)">${c.real}</b></span><b class="${cls(r)}">${pct(r)}</b></div><p>${c.story}</p><div class="small">${c.sec} · 내 매매 ${n}회</div></div>`}).join('')}
  <p class="small" style="margin-top:8px">기업 주가 흐름은 실제 흐름을 근사한 게임용 데이터예요.</p></div>
 <div class="sec pf">▶ YOUR TYPE · 투자 성향</div>
 <div class="px persona">${S(pe.s,96)}<div class="pn">${pe.n}</div><div class="pt">${pe.t}</div><div class="pdsc">${pe.d}</div>
  <div class="gb2"><div><b class="up">강점</b><br>${pe.good}</div><div><b class="dn">약점</b><br>${pe.bad}</div></div>
  <button class="pbtn gold mbtn" id="share" style="width:100%;margin-top:14px">결과 복사해서 자랑하기</button></div>
 <div class="px panel"><b>이렇게 판단했어요</b><ul class="ev" style="margin-top:6px">${evid.map(([a,b])=>`<li><span>${a}</span><b>${b}</b></li>`).join('')}</ul></div>
 <div class="px panel" style="background:#22174a"><div class="row" style="justify-content:flex-start">${S('brain',28)}<b>고수들의 패턴</b></div><p style="font-size:14px;line-height:1.7;margin-top:6px;color:#dcdaf2">${pe.tip}</p></div>
 <div class="sec pf">▶ HALL OF FAME · 시장 대비 수익</div>
 <div class="px panel"><ul class="rk" id="rk"></ul><div class="in1" id="regw"><input id="nm" maxlength="10" placeholder="닉네임 (최대 10자)" value="익명 개미"><button class="pbtn gold" id="reg">등록</button></div></div>
 <div class="sec pf">▶ CRISIS DEX ${dex.length}/${EPS.length}</div>
 <div class="dex">${EPS.map(e=>{const on=dex.includes(e.id),nw=run.dexNew.includes(e.id);return`<div class="dx ${on?'on':''} ${nw?'new':''}">${on?S('chart',22)+e.short+(nw?'<span class="pf" style="font-size:7px">NEW!</span>':''):S('skull',20)+'???'}</div>`}).join('')}</div>
 <button class="pbtn gold press pf" id="again" style="margin-top:20px">▶ 다시 회귀하기</button>
 <p class="note">지수·기업 차트는 실제 과거 흐름을 근사해 압축한 게임용 데이터입니다. 투자 성향 결과는 게임 내 행동 기반 재미용 분석이며 투자 권유가 아닙니다.</p>`;
 drawChart($('#repc'),st.p,run.upto,st.marks,EP.ann);
 renderRank(null);
 $('#reg').onclick=()=>{const nm=($('#nm').value||'익명 개미').slice(0,10);const r=LS.get('antRegRank2',[]);const me={n:nm,al:+alpha.toFixed(1),r:ret,era:EP.short,pt:`${pe.n} · 정보 ${s.infoBuys}회 · 최대콤보 ${s.maxCombo}`,id:Date.now()};r.push(me);LS.set('antRegRank2',r);$('#regw').style.display='none';renderRank(me.id);sfx.win()};
 $('#share').onclick=async()=>{const txt=`🐜 ANTERNAL RETURN 결과\n시대: ${EP.name}\n유형: ${pe.n} ${pe.t}\n수익률 ${pct(ret)} · 시장 대비 ${alpha>=0?'+':''}${alpha.toFixed(1)}%p\n#ANTERNAL_RETURN`;
  try{await navigator.clipboard.writeText(txt);$('#share').textContent='복사 완료!'}catch(e){$('#share').textContent='아래 내용을 직접 복사하세요';const pre=document.createElement('pre');pre.style.cssText='white-space:pre-wrap;text-align:left;font-size:12px;margin-top:8px;user-select:all';pre.textContent=txt;$('#share').after(pre)}};
 $('#again').onclick=()=>{sfx.click();busy=false;newRun()};
 if(alpha>=0&&reason!=='깡통'){sfx.big();confetti();setTimeout(confetti,600)}
}
function renderRank(myId){
 const r=[...GHOSTS.map(g=>({...g,ghost:1})),...LS.get('antRegRank2',[])].sort((a,b)=>b.al-a.al).slice(0,10);
 $('#rk').innerHTML=r.map((x,i)=>`<li class="${x.id===myId?'me':''} ${i<3?'top':''}"><span class="no pf">${i+1}</span>${i===0?S('trophy',22):x.ghost?S('ant:neutral',22):S('ant:happy',22)}<span class="nm">${x.n}${x.ghost?' <span class="small">(고스트)</span>':''}<small>${x.era} · ${x.pt}</small></span><span style="text-align:right"><b class="${cls(x.al)}">${x.al>=0?'+':''}${x.al.toFixed(1)}%p</b><br><span class="small">수익 ${pct(x.r)}</span></span></li>`).join('');
}

/* ========= screens ========= */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function intro(){
 $('#rules').innerHTML=[['chart','과거 어느 시대의 증시에서 <b>30주</b>를 버텨라'],['bldg','그 시대 <b>실존 기업</b>에 투자 (가명으로 등장)'],['eye','<b>정보상</b>: 소문 → 특종 → 내부자 쪽지, <b>단계별로 사는 정보</b>'],['hourglass','<b>회귀권</b>: 깡통이나 한 주 -10%를 맞으면 <b>1주 전으로</b>'],['chest','10주·20주차에 <b>보급 상자</b>'],['trophy','랭킹은 <b>시장 대비 초과수익</b>으로']].map(([s,t])=>`<div>${S(s,20)}${t}</div>`).join('');
 const best=LS.get('antRegBest',null),dex=LS.get('antRegDex',[]);
 $('#introInfo').innerHTML=(best!=null&&best>-999?`<span class="chip">${S('trophy',16)}최고 기록 <b>시장 대비 ${best>=0?'+':''}${(+best).toFixed(1)}%p</b></span>`:'')+`<span class="chip">${S('chart',16)}위기 도감 <b>${dex.length}/${EPS.length}</b></span>`;
}
const IS=new Scene($('#introScene'));IS.mood='night';IS.ant='cool';IS.board='1998?';IS.bcol='#ffd23f';IS.antX=72;scenes.push(IS);IS.draw();
setInterval(()=>{IS.board=['1998?','2008?','2020?','20XX?'][Math.random()*4|0];if(Math.random()<.4)IS.jump=9},2200);
SC=new Scene($('#scene'));scenes.push(SC);
$('#startBtn').onclick=()=>{sfx.win();newRun()};
$('#next').onclick=nextWeek;$('#peekBtn').onclick=peek;$('#shopBtn').onclick=buyInfo;
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'×':'♪'};
addEventListener('resize',()=>{if(st&&$('#game').classList.contains('on'))drawChart($('#chart'),st.p,busy&&st.day?st.day:st.turn*DPT,st.marks)});
addEventListener('keydown',e=>{if(!$('#game').classList.contains('on')||$('#modal').classList.contains('on'))return;if(e.code==='Space'||e.code==='Enter'){e.preventDefault();nextWeek()}});
intro();

</script>
