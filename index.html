<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주린이 감자</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b1a;--panel:#171a33;--panel2:#20244a;--edge:#000;--hi:#3a4080;--up:#ff4d5e;--down:#4d8dff;--gold:#ffd23f;--txt:#f2f0ff;--mut:#9a9cc4;--purple:#b26bff;--green:#3ddc97}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at top,#1a1440 0%,var(--bg) 60%) fixed}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000018 2px 3px)}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
img.spr,canvas.px8{image-rendering:pixelated;image-rendering:crisp-edges}
.wrap{max-width:480px;margin:0 auto;padding:10px 10px 112px;position:relative}
.screen{display:none}.screen.on{display:block}
.pf{font-family:'Press Start 2P',monospace;letter-spacing:0}
.bh{font-family:'Black Han Sans',sans-serif}
/* pixel panel */
.px{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--hi),inset 0 -5px 0 2px #0006,0 4px 0 #000;position:relative;
 clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.panel{padding:12px 13px;margin-bottom:10px}
.pbtn{border:3px solid #000;font-weight:900;position:relative;transition:transform .05s;box-shadow:inset -3px -4px 0 #0005,inset 3px 3px 0 #fff4,0 3px 0 #000}
.pbtn:active:not(:disabled){transform:translateY(3px);box-shadow:inset -3px -4px 0 #0005,inset 3px 3px 0 #fff4,0 0 0 #000}
.pbtn:disabled{filter:grayscale(.85) brightness(.55);cursor:default}
.gold{background:var(--gold);color:#3a2300}
.red{background:#e8384d;color:#fff}
.blue{background:#3b6fe0;color:#fff}
.purp{background:#8a4fe0;color:#fff}
.dark{background:var(--panel2);color:var(--txt)}
/* intro */
#intro .wrap{padding-top:18px;text-align:center}
.titlebox{position:relative;margin-bottom:14px}
#introScene{width:100%;display:block}
.logo{font-family:'Black Han Sans';font-size:min(15vw,60px);white-space:nowrap;line-height:1;color:var(--gold);text-shadow:4px 4px 0 #b3410e,8px 8px 0 #000;margin:16px 0 4px;animation:float 2.4s ease-in-out infinite}
.logo-en{font-size:10px;color:#ff9b5e;letter-spacing:3px}
@keyframes float{50%{transform:translateY(-5px)}}
.sub{color:var(--mut);margin:14px 0 16px;line-height:1.7;font-size:14px}
.rules{text-align:left;font-size:13px;line-height:2}
.rules img{vertical-align:-5px;margin-right:6px}
.rules b{color:var(--gold)}
.press{width:100%;padding:18px;font-size:16px;margin-top:14px}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:2px solid #000;padding:5px 9px;font-size:12px;margin:3px;color:var(--mut)}
.chip b{color:var(--txt)}
/* hud */
.hud{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stb{padding:7px 9px;font-size:10px;color:var(--gold);background:#2a1d55}
.weeks{flex:1;display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.weeks i{height:12px;background:#262a52;border:1px solid #000}
.weeks i.d{background:var(--gold)}
.weeks i.c{background:#fff;animation:blink .6s steps(2) infinite}
.weeks i.bs{background:#ff4d5e55}
.hudr{display:flex;gap:4px;align-items:center}
#rwIcons{display:flex;gap:1px;align-items:center;font-size:10px}
#mute{padding:5px 7px;font-size:10px}
/* scene */
.scene{padding:0;margin-bottom:10px;overflow:hidden;background:#000}
#scene{width:100%;display:block}
.bubble{position:absolute;left:21%;top:16%;background:#fff;color:#111;font-weight:900;font-size:13px;padding:6px 10px;border:3px solid #000;white-space:nowrap;opacity:0;transform:scale(.6);transition:all .18s;pointer-events:none}
.bubble.on{opacity:1;transform:scale(1)}
.bubble:after{content:'';position:absolute;left:8px;bottom:-9px;border:6px solid transparent;border-top-color:#000}
.combo{position:absolute;right:8px;top:8px;font-size:12px;color:var(--gold);text-shadow:2px 2px 0 #000;display:none;align-items:center;gap:4px;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.billbd{position:absolute;right:8px;bottom:8px;font-size:9px;text-shadow:2px 2px 0 #000;color:#fff}
/* hp */
.lbl{font-size:9px;color:var(--mut)}
#total{font-size:22px;margin:8px 0 2px;text-shadow:3px 3px 0 #000}
.hpbar{height:16px;background:#0a0b1c;border:3px solid #000;position:relative;margin:8px 0 6px}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#7cffb5 0 35%,#2fd47e 35% 70%,#1d9a58 70%);transition:width .25s}
.hpbar.mid i{background:linear-gradient(180deg,#ffe58a 0 35%,#ffc021 35% 70%,#c98a00 70%)}
.hpbar.low i{background:linear-gradient(180deg,#ff9aa4 0 35%,#ff4d5e 35% 70%,#b5243a 70%);animation:blink .4s steps(2) infinite}
.hpbar:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 9px,#0007 9px 11px)}
.hpbar .tg{position:absolute;top:-6px;bottom:-6px;width:3px;background:#fff;box-shadow:0 0 0 1px #000;z-index:2}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.small{font-size:11px;color:var(--mut)}
/* crt */
.crt{padding:8px;margin-bottom:10px;background:#2a2d4f}
.crt-in{background:#060914;border:3px solid #000;box-shadow:inset 0 0 18px #0a1a3a;position:relative;overflow:hidden}
.crt-in:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#ffffff08 2px 3px),radial-gradient(ellipse,#0000 60%,#0008)}
.crt-top{display:flex;justify-content:space-between;padding:6px 8px 0;font-size:9px;color:#6fe3a0}
#chart{width:100%;height:170px;display:block}
.leds{display:flex;gap:5px;justify-content:flex-end;padding:5px 2px 0}
.leds i{width:6px;height:6px;background:#3ddc97;box-shadow:0 0 6px #3ddc97}.leds i+i{background:#ff4d5e;box-shadow:0 0 6px #ff4d5e;animation:blink 1.2s steps(2) infinite}
/* rumor */
.rumor{display:flex;gap:10px;align-items:center;background:#22174a}
.rumor .tx{flex:1;font-size:14px;line-height:1.45;font-weight:700}
.rumor .acc{font-size:9px;color:var(--purple);margin-bottom:5px}
#perkBar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.pchip{display:flex;align-items:center;gap:4px;background:var(--panel2);border:2px solid #000;padding:3px 7px 3px 3px;font-size:11px;font-weight:700}
/* inventory */
.invh{font-size:10px;color:var(--gold)}
.slot{display:grid;grid-template-columns:52px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:3px dashed #2c3060}
.slot:first-child{border-top:none}
.icon{width:52px;height:52px;background:#0e1030;border:3px solid #000;box-shadow:inset 0 0 0 2px #2f3570;display:flex;align-items:center;justify-content:center}
.slot.has .icon{box-shadow:inset 0 0 0 2px var(--gold),0 0 10px #ffd23f55}
.an{font-weight:900;font-size:15px}
.tag{font-size:8px;padding:3px 5px;background:#000;color:var(--gold);margin-left:4px;vertical-align:2px}
.ach{font-size:11px;margin-top:3px}
.ah{text-align:right;font-weight:900;font-size:14px}
.btns{grid-column:1/4;display:flex;gap:4px;margin-top:4px}
.btns button{flex:1;padding:9px 0;font-size:12px}
.up{color:var(--up)}.dn{color:var(--down)}
.lockmsg{font-size:12px;color:#ff8d98;padding:2px 0 8px;font-weight:700}
/* bottom */
.bottom{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--bg) 72%,transparent);padding:14px 10px 16px;z-index:5}
.bottom .in{max-width:480px;margin:0 auto;display:flex;gap:7px}
.sq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px;font-size:9px;min-width:64px}
#next{flex:1;font-size:15px;padding:16px 0}
/* modal */
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
#modal.on{display:flex}
.mbox{max-width:440px;width:100%;max-height:90vh;overflow:auto;text-align:center;padding:20px 16px;animation:pop .3s steps(5)}
@keyframes pop{from{transform:scale(.4)}}
.mbox h2{font-family:'Black Han Sans';font-size:26px;margin:8px 0;text-shadow:3px 3px 0 #000}
.mbox p{color:#d8d6f0;line-height:1.65;font-size:15px}
.dlg{background:#0b0d24;border:3px solid #fff;padding:12px 14px;text-align:left;margin-top:10px;font-size:15px;line-height:1.6;min-height:52px;font-weight:700}
.dlg:after{content:'▼';display:block;text-align:right;font-size:10px;animation:blink .6s steps(2) infinite}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.mbtn{padding:13px;font-size:15px}
.cards{display:flex;gap:7px;margin-top:14px}
.tcg{flex:1;background:#141738;border:3px solid #000;padding:0 0 10px;text-align:center;transition:transform .12s;position:relative;box-shadow:0 4px 0 #000}
.tcg:hover{transform:translateY(-8px)}
.tcg .rb{font-size:8px;padding:6px 0;color:#000}
.tcg .art{margin:10px auto 6px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:#0b0d24;border:2px solid #000}
.tcg .pn{font-weight:900;font-size:13px;margin:4px 4px;min-height:34px;display:flex;align-items:center;justify-content:center}
.tcg .pd{font-size:11px;color:var(--mut);line-height:1.4;padding:0 6px}
.r-일반 .rb{background:#aab0c9}.r-희귀 .rb{background:#5b9bff}.r-전설 .rb{background:var(--gold)}
.r-희귀{box-shadow:0 0 0 2px #5b9bff,0 0 18px #4d8dff66}
.r-전설{box-shadow:0 0 0 2px var(--gold),0 0 26px #ffd23f88;animation:legend 1.2s infinite alternate}
@keyframes legend{to{box-shadow:0 0 0 2px #fff,0 0 34px #ffd23fcc}}
.era{background:#2a1d55;border:3px solid var(--gold);padding:16px;margin:10px 0;animation:flip .7s steps(7) both}
@keyframes flip{from{transform:rotateY(90deg)}}
.era .en{font-family:'Black Han Sans';font-size:25px;color:var(--gold);text-shadow:3px 3px 0 #000}
.cmp{display:flex;justify-content:space-between;font-size:14px;padding:4px 2px}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.ft{position:absolute;font-family:'Press Start 2P';font-size:15px;animation:ft 1.3s steps(12) forwards;text-shadow:3px 3px 0 #000;white-space:nowrap}
@keyframes ft{0%{transform:translate(-50%,0);opacity:0}10%{opacity:1}100%{transform:translate(-50%,-80px);opacity:0}}
.banner{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font-family:'Press Start 2P';font-size:34px;text-shadow:4px 4px 0 #000,-2px -2px 0 #000;animation:bn 1.4s forwards;white-space:nowrap;text-align:center}
.banner small{display:block;font-family:'Black Han Sans';font-size:24px;color:#fff;margin-top:10px}
@keyframes bn{0%{transform:translate(-50%,-50%) scale(3);opacity:0}12%{transform:translate(-50%,-50%) scale(1);opacity:1}18%{transform:translate(-50%,-50%) scale(1.2)}24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;animation:fl .5s steps(4) forwards}
@keyframes fl{from{opacity:.6}to{opacity:0}}
.cf{position:absolute;width:8px;height:8px;top:-12px;animation:cf steps(18) forwards}
@keyframes cf{to{transform:translate(var(--dx),108vh) rotate(var(--r))}}
.coinfx{position:absolute;animation:coin 1s steps(10) forwards}
@keyframes coin{0%{transform:translate(0,0)}40%{transform:translate(var(--dx),-70px)}100%{transform:translate(calc(var(--dx)*1.6),40px);opacity:0}}
.shake{animation:shake .45s steps(9)}
@keyframes shake{10%,90%{transform:translate(-3px,2px)}20%,80%{transform:translate(6px,-3px)}30%,50%,70%{transform:translate(-10px,4px)}40%,60%{transform:translate(10px,-4px)}}
.rewind{position:absolute;inset:0;background:#2b0f5acc;display:flex;align-items:center;justify-content:center;flex-direction:column;animation:fl 1.4s reverse forwards}
.rewind img{animation:spin .4s steps(8) infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.rewind .rt{font-family:'Black Han Sans';font-size:32px;color:#e9d6ff;margin-top:14px;text-shadow:3px 3px 0 #000}
.rewind .rl{position:absolute;left:0;right:0;height:3px;background:#fff6;animation:rl .3s linear infinite}
@keyframes rl{from{top:100%}to{top:0}}
body.sepia .wrap{filter:sepia(.9) hue-rotate(225deg) saturate(1.6) contrast(1.1)}
.stamp{position:absolute;left:50%;top:40%;font-family:'Black Han Sans';font-size:86px;color:var(--up);border:8px solid var(--up);padding:4px 24px;transform:translate(-50%,-50%) rotate(-12deg);animation:stamp .4s steps(4) both;background:#000a;white-space:nowrap;text-shadow:4px 4px 0 #000}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(4);opacity:0}}
/* ending */
#ending .wrap{padding-bottom:40px}
.hero{text-align:center;padding:20px 0 6px}
.hero .hk{font-family:'Black Han Sans';font-size:40px;text-shadow:4px 4px 0 #000;margin-top:8px}
.persona{background:#2a1d55;padding:20px;text-align:center;margin:12px 0}
.persona .pn{font-family:'Black Han Sans';font-size:32px;margin:6px 0;text-shadow:3px 3px 0 #000}
.persona .pt{color:#d9b8ff;font-weight:700}
.persona .pdsc{margin-top:10px;color:#dcdaf2;line-height:1.7;font-size:14px}
.gb2{display:flex;gap:8px;margin-top:12px;text-align:left;font-size:13px}
.gb2>div{flex:1;background:#141738;border:3px solid #000;padding:9px}
.sec{font-size:12px;color:var(--gold);margin:22px 0 10px;text-shadow:2px 2px 0 #000}
.ev li{list-style:none;padding:8px 0;border-top:2px dashed #2c3060;display:flex;justify-content:space-between;font-size:13px}
.ev li:first-child{border-top:none}
.gh{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0}
.gh .gl{width:112px;flex:none}
.gh .gb{flex:1;height:12px;background:#0a0b1c;border:2px solid #000;position:relative}
.gh .gb i{position:absolute;top:0;bottom:0}
.gh .gb:before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:#555a8a}
.gh .gv{width:58px;text-align:right;font-weight:900}
.gh.me .gl{color:var(--gold);font-weight:900}
.rep canvas{width:100%;height:140px;display:block;margin:8px 0;background:#060914;border:3px solid #000}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.dx{background:#141738;border:3px solid #000;padding:9px 4px;text-align:center;font-size:12px;min-height:70px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;color:#555a8a}
.dx.on{background:#2a1d55;color:var(--gold);font-weight:900;box-shadow:inset 0 0 0 2px var(--gold)}
.dx.new{animation:legend .8s infinite alternate}
.rk li{list-style:none;display:flex;gap:10px;padding:9px 4px;border-top:2px dashed #2c3060;font-size:13px;align-items:center}
.rk li:first-child{border-top:none}
.rk li .no{width:26px;font-size:10px;color:var(--mut)}
.rk li.top .no{color:var(--gold)}
.rk li .nm{flex:1}
.rk li .nm small{display:block;color:var(--mut);font-size:11px}
.rk li.me{background:#ffd23f22}
.in1{display:flex;gap:6px;margin-top:10px}
.in1 input{flex:1;background:#0b0d24;border:3px solid #000;padding:10px;color:var(--txt);font-family:inherit;font-size:14px}
.in1 button{padding:0 16px;font-size:13px}
.chal{background:#3a2608;border:3px solid #000;box-shadow:inset 0 0 0 2px #8a5a10;padding:12px 14px;font-size:14px;line-height:1.6}
.note{font-size:11px;color:#5d608a;text-align:center;margin-top:18px;line-height:1.6}
.ok{color:var(--green)}
/* ===== v2 추가 ===== */
.mrow{display:flex;gap:8px;margin-top:10px}
.mrow .pbtn{flex:1;padding:13px 4px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.res{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.rc{display:inline-flex;align-items:center;gap:4px;background:#0e1030;border:2px solid #000;padding:3px 7px;font-size:11px;color:var(--mut)}
.rc b{color:var(--txt)}
.coach{background:#3a2608;box-shadow:inset 0 0 0 2px #8a5a10,0 4px 0 #000;font-weight:700;font-size:14px;line-height:1.5;gap:10px;align-items:center}
.coach b{color:var(--gold)}
.weeks i.nb{box-shadow:inset 0 -5px 0 var(--up)}.weeks i.ng{box-shadow:inset 0 -5px 0 var(--green)}
.rumor{align-items:flex-start}
.hint{display:flex;gap:7px;align-items:flex-start;padding:6px 0;border-top:2px dashed #3a2f6a;font-size:13px;font-weight:700;line-height:1.4}
.hint:first-child{border-top:none;padding-top:0}
.hint img{flex:none;margin-top:1px}
.hint small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.hint .hp{color:#d9b8ff;font-weight:400;font-size:12px}
.hbtn{background:none;color:#d9b8ff;text-decoration:underline;font-size:11px;padding:3px 0}
#shopBtn{align-self:stretch;min-width:68px;font-size:11px;line-height:1.35;font-family:'Noto Sans KR',sans-serif;font-weight:900}
.ktag{font-size:10px;padding:2px 5px;margin-left:4px;color:#fff;font-weight:900;border:2px solid #000}
.ach.dsc{color:var(--mut);font-size:11px}
#helpB{padding:5px 7px;font-size:10px}
.pbtn small{font-weight:700;opacity:.85;font-size:11px;margin-left:3px}
/* 슬롯 머신 */
.mbox.slotbox{padding:0;background:none;border:none;box-shadow:none;clip-path:none;overflow:visible;max-height:none;animation:pop .3s steps(5)}
.sm{--cs:min(21vw,84px);background:linear-gradient(180deg,#d63050 0,#a81d3a 55%,#7d1129 100%);border:4px solid #000;box-shadow:inset 0 0 0 3px #ff7a8f,inset 0 -9px 0 3px #560b1c,0 7px 0 #000;padding:12px 12px 14px;position:relative}
.sm:before,.sm:after{content:'';position:absolute;top:8px;width:8px;height:8px;background:#ffd23f;border:2px solid #000;box-shadow:inset -2px -2px 0 #d98a12}
.sm:before{left:8px}.sm:after{right:8px}
.sm-mq{display:flex;align-items:center;gap:8px;background:#160a2b;border:3px solid #000;padding:9px 8px;box-shadow:inset 0 0 0 2px #6a35b0;margin:0 12px}
.sm-title{flex:none;font-size:14px;color:var(--gold);text-shadow:2px 2px 0 #b3410e,0 0 14px #ffd23faa;white-space:nowrap}
.bulbs{flex:1;display:flex;justify-content:space-between}
.bulbs i{width:6px;height:6px;background:#5a4a1a;box-shadow:0 0 0 1px #000;animation:bulb .7s steps(2) infinite}
.bulbs i:nth-child(even){animation-delay:.35s}
@keyframes bulb{50%{background:#ffe066;box-shadow:0 0 0 1px #000,0 0 8px #ffd23f}}
.sm.hot .bulbs i{animation-duration:.18s}
.sm.hot .sm-title{animation:blink .18s steps(2) 10}
.sm-wk{font-size:8px;color:#ffc9d2;margin-top:8px;text-shadow:1px 1px 0 #000}
.sm-body{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:8px}
.sm-win{position:relative;background:#05060f;border:4px solid #000;box-shadow:inset 0 0 0 3px #8a6a12,0 0 0 3px #ffd23f,0 0 0 6px #000;padding:7px}
.reels{display:flex;gap:5px}
.reel{width:var(--cs);height:calc(var(--cs)*3);overflow:hidden;background:#fff;border:2px solid #000}
.strip{will-change:transform}
.strip.blur{filter:blur(1.8px)}
.sc{width:var(--cs);height:var(--cs);display:flex;align-items:center;justify-content:center;border-bottom:2px solid #c3c8de;background:linear-gradient(180deg,#f7f8ff,#e4e7f5)}
.sc img{width:64%;height:64%}
.sc.q{font-size:22px;color:#b3b9d2}
.sc.win{background:#ffe066;animation:scw .3s steps(2) 8}
.sc.win img{animation:pulse .3s infinite alternate}
.sc.dim img{opacity:.3;filter:grayscale(.7)}
@keyframes scw{50%{background:#fff}}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let AC=null,muted=false;
function tone(f,dur,type='square',vol=.08,slide=0,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}

function genSeries(ep,rng){
 const N=TURNS*DPT,k=ep.k,idx=k.map(([t])=>Math.round(t*N)),lv=k.map(([,v])=>Math.log(v));
 const base=[],adj=[],w=[0],vol=ep.vol/100*1.15;
 for(let i=1;i<=N;i++)w[i]=w[i-1]+gauss(rng)*vol;
 for(let j=0;j<k.length-1;j++){const a=idx[j],b=idx[j+1];for(let i=a;i<=b;i++){const f=b===a?0:(i-a)/(b-a);base[i]=lv[j]+(lv[j+1]-lv[j])*f;adj[i]=w[i]-(w[a]+(w[b]-w[a])*f)}}
 const p=base.map((v,i)=>Math.exp(v+adj[i]));return p.map(v=>v/p[0]*100);
}
/* 업종: 지수 흐름 x 베타 + 업종 고유 성과 + 잔파동 */
function genSector(p,sc,rng){const N=p.length-1,w=[0];for(let i=1;i<=N;i++)w[i]=w[i-1]+gauss(rng)*.009;
 return p.map((v,i)=>{const t=i/N*4,k=Math.min(3,Math.floor(t)),f=t-k;return 100*Math.exp(sc.b*Math.log(v/100)+sc.r[k]*(1-f)+sc.r[k+1]*f+w[i]-w[N]*i/N)})}

 const sec=ep.sec.map(sc=>genSector(p,sc,rng)),news={};
 ep.news.forEach(n=>{const w=TURNS===10?Math.floor(n[0]/2):n[0];if(w<TURNS&&!news[w])news[w]=n});

function reroll(t){const a=t*DPT,b=a+DPT,N=TURNS*DPT,vol=EP(st.epi).vol/100;

/* 6개 지표 기준표 (위에서부터 우선 적용). 해당 없으면 기준에 가장 가까운 유형 */
function personaOf(s){
 const T=s.turns||1,v={L:s.levW/T,T:s.tw/T,H:s.holdN?s.holdSum/s.holdN:0,P:s.dropW?s.dropSell/s.dropW:0,R:s.dropW?s.dropBuy/s.dropW:0,C:s.cashW/T},pc=x=>Math.round(x*100)+'%';
 let k=v.L>=.4?'fire':v.T>=.6&&v.H<=2&&s.holdN?'flash':v.P>=.5?'panic':v.C>=.6?'squirrel':v.R>=.5?'hunter':v.H>=8&&v.T<=.2?'rock':null,near=!k;
 if(!k){const sc={fire:v.L/.4,flash:Math.min(v.T/.6,2/Math.max(v.H,.5)),panic:v.P/.5,squirrel:v.C/.6,hunter:v.R/.5,rock:Math.min(v.H/8,.2/Math.max(v.T,.05))};k=Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0]}
 const ev={fire:`레버리지 보유 비중 ${pc(v.L)} (기준 40%)`,flash:`주당 매매 ${v.T.toFixed(1)}회 · 평균 보유 ${v.H.toFixed(1)}주`,panic:`급락 주 매도율 ${pc(v.P)} (기준 50%)`,squirrel:`현금으로 보낸 주 ${pc(v.C)} (기준 60%)`,hunter:`급락 다음 매수율 ${pc(v.R)} (기준 50%)`,rock:`평균 보유 ${v.H.toFixed(1)}주 · 주당 매매 ${v.T.toFixed(1)}회`}[k];
 return{k,near,ev,rows:[['레버리지 보유 비중 (L)',pc(v.L)],['주당 매매 횟수 (T)',v.T.toFixed(1)+'회'],['평균 보유 기간 (H)',v.H.toFixed(1)+'주'],['급락 주 매도율 (P)',s.dropW?pc(v.P):'—'],['급락 후 매수율 (R)',s.dropW?pc(v.R):'—'],['현금으로 보낸 주 (C)',pc(v.C)]]};
}

const SLL=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const rollSym=()=>{let x=Math.random()*100;for(const[s,w]of SLW)if((x-=w)<0)return s;return'gem'};
const isSec=s=>s[0]==='s'&&s.length===2;
const symSpr=s=>isSec(s)?SECS[EP(st.epi).sec[+s[1]].k].s:{news:'news',gem:'gem',shield:'shield',bomb:'bomb',wild:'star'}[s];

  <button class="lever" id="lever" aria-label="레버 당기기"><i class="lk"></i><i class="ls"></i><i class="lb"></i></button></div>
  <div class="sm-info" id="smInfo"></div><div class="mbtns" id="smBtns"></div></div>`;
 slotInfo();slotBtns();$('#lever').onclick=slotSpin;
}

 el.innerHTML=(run.mode==='tut'&&st.turn===0?`<div class="fxr" style="color:var(--gold)">${S('ant:happy',22)}<span>레버를 당기거나 SPIN을 눌러 봐!</span></div>`:'')+
  `<div class="pt"><div>${EP(st.epi).sec.map(sc=>S(SECS[sc.k].s,18)).join('')}</div><div>업종 3개 → 방향 확정</div>
  <div>${S('gem',18)} 포인트 +1P</div><div>${S('news',18)} 무료 헤드라인</div><div>${S('shield',18)} 손실 보험 조각</div><div>${S('bomb',18)} 3개 → 돌발 이벤트</div><div>${S('star',18)} 아무 심볼로 변신</div><div style="color:var(--gold)">돈은 안 나와요!</div></div>
  <div class="sm-sec">${EP(st.epi).sec.map((sc,i)=>`<span>${S(SECS[sc.k].s,14)}${'ABCD'[i]}${SECS[sc.k].n}</span>`).join('')}</div>`;
}
function slotBtns(){
 const bw=$('#smBtns'),sl=st.slot;if(!bw)return;bw.innerHTML='';
 const add=(l,c,f,dis)=>{const b=document.createElement('button');b.className='pbtn mbtn '+c;b.innerHTML=l;b.disabled=!!dis;b.onclick=f;bw.appendChild(b)};

async function slotSpin(){
 const sl=st.slot;if(!sl||sl.busy)return;
 if(sl.n>0){if(duel)return;if(st.respin>0)st.respin--;else if(run.pts>=1)run.pts--;else return}

  const cur=sp.innerHTML,fin=[0,1,2].map(r=>scHTML(sl.grid[r*3+c],r*3+c)).join('');
  sp.style.transition='none';sp.innerHTML=scHTML(rollSym())+fin+Array.from({length:12+c*7},()=>scHTML(rollSym())).join('')+cur;
  const h=sp.children[0].offsetHeight,n=sp.children.length,dur=850+c*480;

  setTimeout(()=>{sfx.thunk();sp.style.transition='none';sp.innerHTML=fin;sp.style.transform='none';res()},dur+40);
 })));
 clearInterval(tick);if(st.slot!==sl)return;
 const r=slotEval();sl.busy=false;
 document.querySelectorAll('.sc[data-i]').forEach(el=>{const i=+el.dataset.i;if(r.hit.has(i))el.classList.add('win');else if(r.hit.size)el.classList.add('dim')});
 $('.sm-lines').innerHTML=r.lines.map(L=>`<polyline points="${L.map(i=>`${i%3+.5},${Math.floor(i/3)+.5}`).join(' ')}"/>`).join('');

 if(r.lines.length){$('#sm').classList.add('hot');r.lines.length>1?sfx.big():sfx.win();confetti(['#ffd23f','#fff','#ff8a1f'],r.lines.length>1?70:32)}else sfx.coin();

function slotEval(){
 const g=st.slot.grid,first=st.slot.n===1,hit=new Set(),fx=[],m=[],lines=[];
 for(const L of SLL){const sy=L.map(i=>g[i]),nw=sy.filter(x=>x!=='wild');let k=null;
  if(!nw.length)k='gem';else if(nw.every(x=>x===nw[0]))k=nw[0];else if(P('smith')&&sy.filter(x=>x==='shield').length===2)k='shield';
  if(k){m.push(k);lines.push(L);L.forEach(i=>hit.add(i))}}
 const cnt=k=>m.filter(x=>x===k).length;
 [...new Set(m.filter(isSec))].forEach(k=>{const d=wkRet(k,st.turn)>=0?1:-1;st.known[k]=d;st.feeFree[k]=true;
  fx.push([symSpr(k),`<b>${secName(k)}</b> 한 줄! 이번 주 <b class="${d>0?'up':'dn'}">${d>0?'▲ 상승':'▼ 하락'}</b> 확정 + 수수료 면제`])});
 if(cnt('gem')){forAll(()=>run.pts+=3*cnt('gem'));fx.push(['gem',`보석 한 줄! 정보 포인트 <b>+${3*cnt('gem')}P</b>`])}
 if(cnt('shield')){forAll(()=>run.ins+=cnt('shield'));fx.push(['shield','방패 한 줄! <b>손실 보험</b> 획득 (큰 손실 1회를 -5%로 방어)'])}
 if(cnt('news')){forAll(()=>{const a=mkHint('news');let b=mkHint('news'),k=0;while(b.txt===a.txt&&k++<8)b=mkHint('news');st.hints.push(a,b)});fx.push(['news','신문 한 줄! 헤드라인 <b>2개</b> 미리 보기'])}
 if(cnt('bomb')){if(run.mode==='solo'){st.bomb=true;fx.push(['bomb','폭탄 한 줄… <b>돌발 이벤트</b>가 터진다!'])}else fx.push(['bomb','폭탄 한 줄… 다행히 불발!'])}
 if(first){
  const lone=k=>g.filter((x,i)=>x===k&&!(hit.has(i)&&m.includes(k))).length,ge=lone('gem'),sh=lone('shield'),nw=cnt('news')?0:g.filter(x=>x==='news').length;
  if(ge){forAll(()=>run.pts+=ge);fx.push(['gem',`보석 x${ge} → 정보 포인트 <b>+${ge}P</b>`])}
  if(sh){let made=false;forAll(()=>{run.frag+=sh;if(run.frag>=4){run.frag-=4;run.ins++;made=true}});fx.push(['shield',`방패 x${sh} → 조각 +${sh}${made?' → <b>보험 완성!</b>':' (4개 모으면 보험)'}`])}
  if(nw){forAll(()=>st.hints.push(mkHint('news')));fx.push(['news','신문 → 무료 헤드라인 <b>1개</b>'])}
 }
 st.slot.unused=g.filter((x,i)=>!hit.has(i)&&(x==='bomb'||x==='wild'||isSec(x))).length;
 return{hit,fx,lines};
}

setInterval(()=>{IS.board=['1998?','2008?','2020?','20XX?'][Math.random()*4|0];if(Math.random()<.4)IS.jump=9},2200);
SC=new Scene($('#scene'));scenes.push(SC);
$('#startBtn').onclick=()=>{sfx.win();if(!LS.get('antRegTut',0)&&!LS.get('antRegBest',0))return modal(`${S('ant:happy',80)}<h2>처음이신가요?</h2><p>3주짜리 연습으로 조작법을 먼저 익힐 수 있어요. (1분)</p>`,[{l:'연습 먼저',c:'gold',f:()=>newRun('tut')},{l:'바로 도전',c:'dark',f:()=>{LS.set('antRegTut',1);newRun()}}]);newRun()};
$('#tutBtn').onclick=()=>{sfx.win();newRun('tut')};$('#glossBtn').onclick=gloss;$('#helpB').onclick=gloss;$('#shopBtn').onclick=shop;
$('#rtx').addEventListener('click',e=>{const b=e.target.closest('.hbtn');if(!b||run.pts<1)return;run.pts--;st.hints[+b.dataset.h].open=true;sfx.coin();render()});
$('#next').onclick=nextWeek;$('#peekBtn').onclick=peek;
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'×':'♪'};
addEventListener('resize',()=>{if(st&&$('#game').classList.contains('on'))drawChart($('#chart'),st.p,busy&&st.day?st.day:st.turn*DPT,st.marks)});
addEventListener('keydown',e=>{if(!$('#game').classList.contains('on')||$('#modal').classList.contains('on'))return;if(e.code==='Space'||e.code==='Enter'){e.preventDefault();nextWeek()}});
intro();
</script>
